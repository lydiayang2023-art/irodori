.nofuri .x rt{display:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 96px;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.sec{margin-block:20px 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.muted{color:var(--ink2)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--ai);color:var(--ai-ink);border-color:var(--ai)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);font-size:12.5px;font-weight:600;color:var(--ink2)}
/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--ai);color:var(--ai-ink);border-radius:18px;padding:18px}
.hero .big{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hero .lbl{font-size:13px;opacity:.85}
.hero .btn{background:var(--ai-ink);color:var(--ai);border:none}
.hero .btn:disabled{opacity:.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2)}
.topic{margin-top:18px}
.topic h2{display:flex;align-items:baseline;gap:8px;font-size:14px;margin:0 0 8px;font-weight:700}
.topic h2 .jp{font-size:15px}
.topic h2 .sw{width:12px;height:12px;border-radius:4px;background:var(--tc);flex:none;align-self:center}
.topic h2 small{color:var(--ink3);font-weight:600;font-size:12px}
.lcard{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.lnum{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--tc) 18%,var(--surface));color:var(--tc);display:grid;place-items:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.ltitle{font-family:var(--jp);font-weight:700;font-size:16px;line-height:1.35}
.lsub{font-size:13px;color:var(--ink2)}
.pips{display:flex;gap:4px}
.pip{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pip.on{background:var(--tc)}
/* lesson */
.lhead{border-radius:18px;padding:18px;background:color-mix(in srgb,var(--tc) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--tc) 30%,var(--line))}
.lhead .k{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--tc);text-transform:uppercase}
.lhead h2{font-family:var(--jp);font-size:24px;margin:4px 0 2px;line-height:1.3;text-wrap:balance}
.cando{margin:12px 0 0;padding-left:18px;font-size:14px;color:var(--ink2)}
.cando li{margin:2px 0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:112px}
.act .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);color:var(--tc)}
.act .ic svg{width:20px;height:20px}
.act b{font-size:15px}
.act span{font-size:12.5px;color:var(--ink2)}
.act.done{border-color:color-mix(in srgb,var(--tc) 55%,var(--line))}
.act .tick{margin-left:auto;color:var(--tc);font-size:12px;font-weight:700}
/* flashcards */
.prog{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--ai);border-radius:99px;transition:width .25s}
.flash{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:28px 18px;cursor:pointer;user-select:none}
.flash .front{font-family:var(--jp);font-size:40px;font-weight:700;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.flash .front.en{font-family:var(--ui);font-size:26px}
.flash .read{font-family:var(--jp);font-size:20px;color:var(--ink2)}
.flash .mean{font-size:20px;font-weight:600}
.flash .hint{font-size:13px;color:var(--ink3)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{min-height:58px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px}
.grades button small{font-weight:500;color:var(--ink3);font-size:11.5px}
.grades .g0{color:var(--bad)} .grades .g3{color:var(--good)}
.say{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.say svg{width:16px;height:16px}
/* lists */
.vlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.vrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.vrow:first-child{border-top:0}
.vrow .j{font-family:var(--jp);font-size:17px;font-weight:700}
.vrow .e{font-size:13.5px;color:var(--ink2)}
.lvl{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--ink3);white-space:nowrap}
.lvl.l1{background:var(--ai-soft);color:var(--ai)} .lvl.l2{background:var(--good-soft);color:var(--good)}
/* grammar */
.gp{font-family:var(--jp);font-size:18px;font-weight:700;margin:0 0 6px;color:var(--ai)}
.ex{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:start;padding:10px 0;border-top:1px dashed var(--line)}
.ex .j{font-family:var(--jp);font-size:18px;line-height:1.9}
.ex .e{grid-column:1/-1;font-size:13.5px;color:var(--ink2);margin-top:-4px}
.mini{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center}
.mini svg{width:16px;height:16px}
/* quiz */
.q{font-family:var(--jp);font-size:22px;line-height:2;font-weight:700}
.q .blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--ai);margin:0 .15em;text-align:center;color:var(--ai)}
.qen{font-size:14px;color:var(--ink2)}
.opts{display:grid;gap:8px}
.opt{min-height:52px;text-align:left;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:17px;font-family:var(--jp);line-height:1.7}
.opt.en{font-family:var(--ui);font-size:15.5px}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{border-radius:12px;padding:12px 14px;font-size:14.5px}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.built{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tile{font-family:var(--jp);font-size:17px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);line-height:1.8;font-weight:600}
.tile.used{visibility:hidden}
.built .tile{border-color:var(--ai);background:var(--ai-soft)}
.kind{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
/* dialogue & reading */
.dl{display:flex;flex-direction:column;gap:8px}
.ln{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.sp{font-family:var(--jp);font-size:12px;font-weight:700;min-width:2.6em;padding:4px 8px;border-radius:8px;background:var(--surface2);color:var(--ink2);text-align:center;white-space:nowrap}
.ln .tx{font-family:var(--jp);font-size:17.5px;line-height:1.95}
.ln.on .tx{color:var(--ai)}
.ln.on .sp{background:var(--ai);color:var(--ai-ink)}
.hidden-script{filter:blur(7px);user-select:none}
.player{display:flex;align-items:center;gap:10px}
.play{width:64px;height:64px;border-radius:50%;background:var(--ai);color:var(--ai-ink);border:none;display:grid;place-items:center;flex:none}
.play svg{width:26px;height:26px}
.seg{flex:none;white-space:nowrap;display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ai-soft);color:var(--ai)}
.passage{font-family:var(--jp);font-size:19px;line-height:2.15;white-space:pre-wrap;overflow-wrap:anywhere}
.trans{font-size:14.5px;color:var(--ink2);border-left:3px solid var(--line);padding-left:12px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mitem{min-height:48px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-size:15px;line-height:1.6}
.mitem.jp{font-family:var(--jp);font-size:17px}
.mitem.sel{border-color:var(--ai);background:var(--ai-soft)}
.mitem.done{border-color:var(--good);background:var(--good-soft);color:var(--good);opacity:.8}
.mitem.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.result{text-align:center;padding:28px 16px}
.result .score{font-size:56px;font-weight:700;color:var(--ai);font-variant-numeric:tabular-nums;line-height:1}
.toggle{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.sw2{width:48px;height:28px;border-radius:99px;background:var(--line);border:none;position:relative;flex:none}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw2[aria-checked="true"]{background:var(--ai)}
.sw2[aria-checked="true"]::after{left:23px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.note{font-size:13px;color:var(--ink2);background:var(--surface2);border-radius:12px;padding:10px 12px}
.sync{font-size:12px;color:var(--ink3);text-align:center;margin-top:18px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* ===== colour & motion layer ===== */
body{background:var(--bg) radial-gradient(120% 60% at 100% 0%,color-mix(in srgb,var(--t1) 14%,transparent),transparent 60%) no-repeat,var(--bg)}
.view{animation:viewIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.mascot{display:block;flex:none}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
.hop{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{30%{transform:translateY(-14px) scale(1.06,.94)}60%{transform:translateY(0) scale(.96,1.04)}}
/* hero */
.hero2{position:relative;overflow:hidden;border-radius:22px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--t5),var(--t6) 55%,var(--t1));display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hero2::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero2 .mascot{--mc:var(--t2)}
.hero2 .bubble{position:relative;background:#fff;color:#1c2333;border-radius:14px;padding:8px 12px;font-family:var(--jp);font-weight:700;font-size:16px;display:inline-block}
.hero2 .bubble::before{content:"";position:absolute;left:-7px;top:14px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.hero2 .bubble small{display:block;font-family:var(--ui);font-weight:600;font-size:12px;color:#5a6478}
.hero2 .due{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.hero2 .due b{font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.hero2 .btn{background:#fff;color:#25406e;border:none;min-height:42px}
.hero2 .btn:disabled{opacity:.75}
.goal{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--rc,var(--t4)) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;transition:--p .6s}
.ring>span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.stats2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats2 .stat{display:flex;flex-direction:column;gap:2px}
.stats2 .stat .e{font-size:20px;line-height:1}
.flame{display:inline-block;animation:flick 1.4s ease-in-out infinite}
@keyframes flick{50%{transform:scale(1.15) rotate(4deg)}}
/* topics & lesson cards */
.tband{display:grid;grid-template-columns:1fr 92px;align-items:center;gap:8px;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--tc) 16%,var(--surface));margin-bottom:8px}
.tband .art svg{width:92px;height:69px;display:block}
.tband .t1{font-family:var(--jp);font-weight:700;font-size:18px;color:color-mix(in srgb,var(--tc) 70%,var(--ink))}
.tband .t2{font-size:12.5px;color:var(--ink2);font-weight:600}
.lcard{transition:transform .15s}
.lcard:active{transform:scale(.98)}
.lnum.em{font-size:24px;background:color-mix(in srgb,var(--tc) 22%,var(--surface))}
.lnum .nn{position:absolute}
.lcard .ring{width:40px;height:40px;--rc:var(--tc)}
.lcard .ring>span{width:30px;height:30px;font-size:10.5px}
/* lesson header */
.lhead{position:relative;overflow:hidden}
.lhead .art{position:absolute;right:-6px;top:6px;opacity:.95}
.lhead .art svg{width:120px;height:90px}
.lhead h2,.lhead .k,.lhead .muted{position:relative;max-width:calc(100% - 96px)}
.act .ic{background:color-mix(in srgb,var(--ac,var(--tc)) 18%,var(--surface));color:var(--ac,var(--tc))}
.act{transition:transform .15s,box-shadow .15s}
.act:active{transform:scale(.97)}
.act.feature{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;background:linear-gradient(120deg,color-mix(in srgb,var(--tc) 22%,var(--surface)),var(--surface))}
.act.feature .tx{display:flex;flex-direction:column;gap:2px}
/* flip card */
.flipwrap{perspective:1200px}
.flipcard{position:relative;min-height:330px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.9,.3,1);cursor:pointer}
.flipcard.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 18px;text-align:center;background:var(--surface);border:1px solid var(--line)}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,color-mix(in srgb,var(--tc,var(--t5)) 14%,var(--surface)),var(--surface))}
.face .pic{font-size:64px;line-height:1}
.face .front{font-family:var(--jp);font-size:40px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.face .front.en{font-family:var(--ui);font-size:26px}
.pop{animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.85)}100%{transform:scale(1)}}
.opt.right{animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
.opt.wrong{animation:shake .3s}
.feedback{display:flex;align-items:center;gap:10px}
.feedback .mascot{width:40px;height:40px}
/* confetti */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.result .mascot{margin:0 auto}
/* picture games */
.picopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picopt{aspect-ratio:1.25;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-size:52px;display:grid;place-items:center;transition:transform .12s}
.picopt:active{transform:scale(.95)}
.picopt.right{border-color:var(--good);background:var(--good-soft);animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
.picopt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
.bigpic{font-size:88px;line-height:1;text-align:center}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;perspective:900px}
.mcard{aspect-ratio:.85;position:relative;transform-style:preserve-3d;transition:transform .4s;border:0;background:none;padding:0}
.mcard.up{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:6px;text-align:center}
.mcard .f{background:linear-gradient(135deg,var(--tc),color-mix(in srgb,var(--tc) 60%,var(--t6)));color:#fff;font-family:var(--jp);font-weight:700;font-size:22px}
.mcard .b{transform:rotateY(180deg);background:var(--surface);border:2px solid var(--line);font-family:var(--jp);font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.mcard .b.p{font-size:40px}
.mcard.ok .b{border-color:var(--good);background:var(--good-soft)}
.mcard.ok{animation:pop .4s}
.hud{display:flex;gap:8px;flex-wrap:wrap}
/* speaking */
.mic-hint{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink2);background:var(--surface2);border-radius:12px;padding:10px 12px}
.say-in{width:100%;min-height:64px;font:inherit;font-family:var(--jp);font-size:20px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);resize:none}
.say-in:focus{outline:none;border-color:var(--tc,var(--ai))}
.prompt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:22px 16px}
.prompt .en{font-size:20px;font-weight:700}
.meter{display:flex;align-items:center;gap:14px}
.meter .ring{width:72px;height:72px}
.meter .ring>span{width:56px;height:56px;font-size:16px}
.diff{font-family:var(--jp);font-size:19px;line-height:2}
.diff .miss{background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:0 2px;text-decoration:underline wavy}
.diff .hit{color:var(--good)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;border-radius:16px;padding:10px 12px;line-height:1.6}
.msg.them{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--ai);color:var(--ai-ink);align-self:flex-end;border-bottom-right-radius:4px;font-family:var(--jp);font-size:17px}
.msg .ja{font-family:var(--jp);font-size:18px}
.msg .kn{font-family:var(--jp);font-size:13px;color:var(--ink2)}
.msg .en{font-size:13.5px;color:var(--ink2);margin-top:2px}

/* ---------------- state & persistence ---------------- */
const LS_KEY = "irodori-study-v1";
const blank = () => ({ v: 1, srs: {}, sc: {}, days: {}, set: { furi: true, rate: 1, dir: "jp", newPer: 10, sfx: true, goal: 30 }, t: 0 });
let S = blank();
function adopt(o) { const b = blank(); S = { ...b, ...o, set: { ...b.set, ...(o.set || {}) }, srs: o.srs || {}, sc: o.sc || {}, days: o.days || {} }; }
try { const s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (s && s.v) adopt(s); } catch (e) {}
let cloud = { ref: null, state: "local", busy: false, again: false, timer: 0 };
function save() {
  S.t = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
  if (cloud.ref) { clearTimeout(cloud.timer); cloud.timer = setTimeout(pushCloud, 2500); }
}
async function pushCloud() {
  if (!cloud.ref) return;
  if (cloud.busy) { cloud.again = true; return; }
  cloud.busy = true;
  try { await cloud.ref.set(JSON.parse(JSON.stringify(S))); cloud.state = "synced"; }
  catch (e) { cloud.state = "error"; }
  cloud.busy = false; paintSync();
  if (cloud.again) { cloud.again = false; pushCloud(); }
}
async function initCloud() {
  const c = window.claude;
  if (!c || !c.use) return;
  try {
    const user = await c.use("user"); const id = user && await user.id(); if (!id) return;
    const db = await c.use("db"); if (!db) return;
    cloud.ref = db.doc(`data/users/${id}/progress`);
    const snap = await cloud.ref.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote && (remote.t || 0) > (S.t || 0)) {
      adopt(JSON.parse(JSON.stringify(remote)));
      try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
      cloud.state = "synced"; rerender();
    } else if (S.t && (!remote || S.t > (remote.t || 0))) { pushCloud(); }
    else cloud.state = "synced";

  } catch (e) { cloud.state = "error"; paintSync(); }
}
function paintSync() {

const vid = (n, i) => `v${n}-${i}`;
function vocabCards(n) { return L(n).vocab.map((v, i) => ({ ...v, id: vid(n, i), n })); }
const allCards = () => D.flatMap(l => vocabCards(l.n));

function grade(id, g) {
  const c = S.srs[id] ? { ...S.srs[id] } : { i: 0, e: 2.5, r: 0, l: 0, d: 0 };
  const t = today();
  if (g === 0) { c.e = Math.max(1.3, c.e - 0.2); c.i = 0; c.l = (c.l || 0) + 1; c.d = t; }
  else {
    if (c.i === 0) c.i = g === 3 ? 4 : g === 2 ? (c.r ? 2 : 1) : 1;
    else if (g === 1) c.i = Math.max(c.i + 1, Math.round(c.i * 1.2));
    else if (g === 2) c.i = Math.round(c.i * c.e);
    else c.i = Math.round(c.i * c.e * 1.3);
    if (g === 1) c.e = Math.max(1.3, c.e - 0.15);
    if (g === 3) c.e += 0.15;
    c.d = t + c.i;
  }
  c.r++; S.srs[id] = c; logActivity(); save();
}
function nextIvl(id, g) {

}

let VOICES = [];

const ttsText = s => plain(s).replace(/（[^）]*）/g, "").replace(/^[ＡＢＣA-C]：/gm, "").replace(/＿+/g, "").replace(/[①-⑳]/g, "").trim();
function speak(text, o = {}) {

/* ---------------- lesson progress ---------------- */
const PARTS = ["vocab", "grammar", "kanji", "listen", "speak", "read"];
function prog(n) {
  const cards = vocabCards(n);
  const seen = cards.filter(c => S.srs[c.id] && S.srs[c.id].r > 0).length;
  const l = L(n);
  const avg = keys => keys.length ? keys.reduce((a, k) => a + (S.sc[k] || 0), 0) / keys.length : 0;
  const p = {
    vocab: seen / cards.length >= 0.8, seen, total: cards.length,
    grammar: (S.sc["g" + n] || 0) >= 70,
    kanji: (S.sc["k" + n] || 0) >= 70,
    listen: avg(l.listen.map((_, i) => `l${n}-${i}`)) >= 70,
    speak: (S.sc["sp" + n] || 0) >= 70,
    read: avg(l.read.map((_, i) => `r${n}-${i}`)) >= 70,
  };
  p.count = PARTS.filter(k => p[k]).length;
  p.pct = Math.round(p.count / PARTS.length * 100);
  return p;
}

        next();
      });

    } else if (q.type === "tf") {

    } else {

  }

}

/* ---------------- sound effects & confetti ---------------- */
let AC = null;
function sfx(kind) {
  if (S.set.sfx === false) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const notes = { ok: [[880, 0], [1320, 0.09]], no: [[220, 0], [180, 0.1]], tick: [[1040, 0]], soft: [[520, 0]], win: [[660, 0], [880, 0.12], [1100, 0.24], [1320, 0.36]] }[kind] || [[700, 0]];
    const t0 = AC.currentTime;
    notes.forEach(([f, d]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = kind === "no" ? "triangle" : "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(kind === "no" ? 0.12 : 0.16, t0 + d + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + (kind === "win" ? 0.35 : 0.22));
      o.connect(g).connect(AC.destination); o.start(t0 + d); o.stop(t0 + d + 0.4);
    });
  } catch (e) {}
}
function celebrate(big) {
  if (!big) { sfx("soft"); return; }
  sfx("win");
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let c = document.getElementById("confetti");
  if (!c) { c = document.createElement("canvas"); c.id = "confetti"; document.body.appendChild(c); }
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr; c.style.width = W + "px"; c.style.height = H + "px";
  const x = c.getContext("2d"); x.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = [1, 2, 3, 4, 5, 6, 8, 9].map(i => cs.getPropertyValue("--t" + i).trim() || "#f4b53f");
  const P = Array.from({ length: 110 }, () => ({ x: W / 2 + (Math.random() - 0.5) * 80, y: H * 0.35, vx: (Math.random() - 0.5) * 11, vy: -Math.random() * 11 - 4, r: Math.random() * 6 + 4, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3, s: Math.random() < 0.5 }));
  let f = 0;
  (function tick() {
    x.clearRect(0, 0, W, H); f++;
    P.forEach(p => { p.vy += 0.28; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; if (p.s) x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); else { x.beginPath(); x.arc(0, 0, p.r / 2.4, 0, 6.3); x.fill(); } x.restore(); });
    if (f < 150) requestAnimationFrame(tick); else x.clearRect(0, 0, W, H);
  })();
}
function fbHtml(ok, msg) {
  return `<div class="feedback ${ok ? "ok" : "no"} pop">${mascot(ok ? "happy" : "sad", 40)}<span>${msg}</span></div>`;
}

function gameWords(n) {
  const count = {};
  D.forEach(l => l.vocab.forEach(v => { if (v.pic) count[v.pic] = (count[v.pic] || 0) + 1; }));
  const ok = v => v.pic && count[v.pic] === 1 && !GAME_SKIP.has(v.jp);
  let words = vocabCards(n).filter(ok);
  for (let d = 1; words.length < 8 && d < 18; d++) [n - d, n + d].forEach(m => { if (m >= 1 && m <= 18) words = words.concat(vocabCards(m).filter(ok)); });
  const seen = new Set(); return words.filter(w => !seen.has(w.pic) && seen.add(w.pic));
}
function viewGames(n) {
  const w = gameWords(n);
  app.innerHTML = topbar(`Lesson ${n} · Picture games`) + `<div class="stack" style="--tc:${TOPIC_COLOR(n)}">
    <div class="card" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:30px">${shuffle(w).slice(0, 10).map(x => `<span>${x.pic}</span>`).join("")}</div>

  app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => b.dataset.g === "mem" ? go(viewMemory, n) : go(viewPicQuiz, n, b.dataset.g));
}
function viewPicQuiz(n, mode) {

    const t = rounds[i];

        <div class="card prompt"><button class="play" id="hear" aria-label="Play the word">${IC.sound.replace("<svg", '<svg width="28" height="28"')}</button><span class="small muted">Tap to hear it again</span><div id="word" class="jp" style="font-size:22px;font-weight:700;min-height:32px"></div></div>
        <div class="picopts">${opts.map((o, j) => `<button class="picopt" data-j="${j}" aria-label="${esc(o.en)}">${o.pic}</button>`).join("")}</div><div id="fb"></div></div>`;

      if (!ok) b.classList.add("wrong");

      sayNow(t.kana);
      $("#fb").innerHTML = fbHtml(ok, `<span class="jp">${esc(t.jp)}</span>${t.kana !== t.jp ? ` (${esc(t.kana)})` : ""} = ${esc(t.en)}`) + `<button class="btn primary block" style="margin-top:10px" id="nx">Next</button>`;
      applyFuri();
      $("#nx").onclick = () => { i++; paint(); };

}
function viewMemory(n) {
  const words = shuffle(gameWords(n)).slice(0, 6);
  const cards = shuffle(words.flatMap((w, k) => [{ k, t: "w", w }, { k, t: "p", w }]));
  let open = [], matched = new Set(), moves = 0, lock = false; const t0 = Date.now();
  app.innerHTML = topbar(`Memory match`) + `<div class="stack" style="--tc:${TOPIC_COLOR(n)}">
    <div class="hud"><span class="chip" id="mv">0 moves</span><span class="chip" id="pr">0/6 pairs</span></div>
    <div class="mem">${cards.map((c, i) => `<button class="mcard" data-i="${i}" aria-label="Card ${i + 1}"><span class="f">?</span><span class="b ${c.t === "p" ? "p" : ""}">${c.t === "p" ? c.w.pic : esc(c.w.jp)}</span></button>`).join("")}</div>
    <p class="small muted" style="text-align:center">Find each word and its picture. You'll hear the word when you match it.</p><div id="fb"></div></div>`;
  app.querySelectorAll(".mcard").forEach(b => b.onclick = () => {
    const i = +b.dataset.i; if (lock || matched.has(cards[i].k) || open.includes(i)) return;
    b.classList.add("up"); open.push(i); sfx("tick");
    if (cards[i].t === "w") sayNow(cards[i].w.kana);
    if (open.length < 2) return;
    moves++; $("#mv").textContent = moves + " moves";
    const [a, c] = open;
    if (cards[a].k === cards[c].k) {
      matched.add(cards[a].k); open = [];
      [a, c].forEach(j => app.querySelector(`[data-i="${j}"]`).classList.add("ok"));
      sfx("ok"); sayNow(cards[a].w.kana);
      $("#pr").textContent = `${matched.size}/6 pairs`;
      if (matched.size === 6) {
        const pct = Math.max(40, Math.round(100 - Math.max(0, moves - 6) * 6));
        S.sc["gm" + n] = Math.max(S.sc["gm" + n] || 0, pct); logActivity(3); save(); celebrate(true);
        $("#fb").innerHTML = `<div class="card result stack pop"><div class="hop">${mascot("happy", 72)}</div><b>All pairs found in ${moves} moves and ${Math.round((Date.now() - t0) / 1000)} seconds!</b>
          <div class="vlist" style="text-align:left">${words.map(w => `<button class="vrow" data-act="say" data-text="${esc(w.kana)}"><span><span class="j x">${w.pic} ${w.rb}</span><br><span class="e">${esc(w.en)}</span></span><span class="mini">${IC.sound}</span></button>`).join("")}</div>
          <button class="btn primary block" id="again">Play again</button></div>`;
        $("#again").onclick = () => { stack.pop(); go(viewMemory, n); };
        applyFuri();
      }
    } else {
      lock = true;
      setTimeout(() => { open.forEach(j => app.querySelector(`[data-i="${j}"]`)?.classList.remove("up")); open = []; lock = false; }, 900);
    }
  });
}

/* ---------------- SPEAKING ---------------- */
const toHira = s => String(s).replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const normJ = s => toHira(plain(s).normalize("NFKC")).replace(/[\s、。，．,.!！?？「」『』…・〜~ー－\-（）()：:；;'"“”‘’]/g, "").toLowerCase();
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function targetsOf(t) {
  const base = [t.jp, t.kana].filter(Boolean);
  const out = new Set();
  base.forEach(s => { out.add(normJ(s)); out.add(normJ(String(s).replace(/（[^）]*）/g, ""))); });
  return [...out].filter(Boolean);
}
function scoreSpeech(ans, t) {
  const a = normJ(ans); if (!a) return { pct: 0, best: targetsOf(t)[0] || "", a };
  let best = { pct: -1 };
  targetsOf(t).forEach(x => { const p = Math.max(0, Math.round((1 - lev(a, x) / Math.max(a.length, x.length)) * 100)); if (p > best.pct) best = { pct: p, best: x, a }; });
  return best;
}
function diffHtml(a, b) {
  // mark characters of the answer that are not part of the longest common subsequence with the target
  const m = a.length, n = b.length, L2 = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L2[i][j] = a[i] === b[j] ? L2[i + 1][j + 1] + 1 : Math.max(L2[i + 1][j], L2[i][j + 1]);
  let i = 0, j = 0, out = "";
  while (i < m) { if (j < n && a[i] === b[j]) { out += `<span class="hit">${esc(a[i])}</span>`; i++; j++; } else if (j < n && L2[i][j + 1] >= L2[i + 1][j]) j++; else { out += `<span class="miss">${esc(a[i])}</span>`; i++; } }
  return out;
}
const verdict = p => p >= 85 ? ["Excellent!", "var(--good)", true] : p >= 60 ? ["Close! Listen and try once more.", "var(--warn)", true] : ["Not quite. Listen to the model and try again.", "var(--bad)", false];

const MIC_HELP = `<details class="mic-hint"><summary style="cursor:pointer"><b>How to speak to the app</b> · uses your keyboard's microphone</summary>
  <ol style="margin:8px 0 0;padding-left:18px">
    <li>On iPhone, open <b>Settings → General → Keyboard → Keyboards → Add New Keyboard</b> and add <b>Japanese (Kana or Romaji)</b>. Make sure <b>Enable Dictation</b> is on.</li>
    <li>In this app, tap the answer box, switch to the Japanese keyboard with 🌐, then tap the 🎤 microphone key and speak.</li>
    <li>Your words appear as Japanese text, and the app compares them with the model answer.</li>
  </ol><p style="margin:6px 0 0">No microphone? Say it out loud anyway, then tap <b>Show answer</b> and mark yourself.</p></details>`;

function sayItems(n) {
  const l = L(n);
  const words = shuffle(vocabCards(n).filter(c => c.pic && !/[〜（]/.test(c.jp) && !GAME_SKIP.has(c.jp))).slice(0, 4).map(c => ({ cue: c.en, pic: c.pic, jp: c.jp, kana: c.kana, rb: c.rb, kind: "word" }));
  const sents = shuffle(l.grammar.flatMap(g => g.x.map(([rb, en, kana, jp]) => ({ cue: en, jp, kana, rb, kind: "sentence" })))).slice(0, 6);
  return [...words, ...sents];
}
function repeatItems(n) {
  const l = L(n);
  const g = l.grammar.flatMap(g => g.x.map(([rb, en, kana, jp]) => ({ cue: en, jp, kana, rb })));
  const d = l.listen.flatMap(x => x.lines.filter(y => y[2].length <= 28 && y[2].length >= 4).map(y => ({ cue: "", jp: y[2], kana: y[3], rb: y[1] })));
  return shuffle([...shuffle(g).slice(0, 5), ...shuffle(d).slice(0, 4)]);
}

function viewSpeakMenu(n) {

    ${MIC_HELP}
    <button class="act feature" data-m="say" style="--ac:var(--t8)"><span class="ic" style="width:44px;height:44px">${IC.mic}</span><span class="tx"><b>Say it in Japanese</b><span>See a picture or an English sentence and say it in Japanese.</span></span></button>
    <button class="act feature" data-m="repeat" style="--ac:var(--t5)"><span class="ic" style="width:44px;height:44px">${IC.ear}</span><span class="tx"><b>Listen and repeat</b><span>Hear a sentence, then copy it as closely as you can.</span></span></button>
    ${window.claude ? "" : "<!--"}<button class="act feature" data-m="chat" style="--ac:var(--t6)"><span class="ic" style="width:44px;height:44px">${IC.chat}</span><span class="tx"><b>Chat with Claude</b><span>${esc(SCENES[n][0])}</span></span></button>${window.claude ? "" : "-->"}
    <div class="sec">Role-play a textbook dialogue</div>

  </div>`;
  app.querySelectorAll("[data-m]").forEach(b => b.onclick = () => b.dataset.m === "chat" ? go(viewChat, n) : go(viewSpeak, n, b.dataset.m));
  app.querySelectorAll("[data-rp]").forEach(b => b.onclick = () => go(viewRoleplay, n, +b.dataset.rp, null));
}

function recordSpeak(n, pct) { S.sc["sp" + n] = Math.max(S.sc["sp" + n] || 0, pct); logActivity(); save(); }

function viewSpeak(n, mode) {
  const items = mode === "say" ? sayItems(n) : repeatItems(n);
  const scores = items.map(() => 0);
  let i = 0;
  function paint() {
    if (i >= items.length) {
      const pct = Math.round(scores.reduce((a, b) => a + b, 0) / items.length);
      recordSpeak(n, pct);
      return resultScreen(mode === "say" ? "Say it in Japanese" : "Listen and repeat", pct, `Average match across ${items.length} prompts`, () => go(viewSpeak, n, mode), true);
    }
    const t = items[i]; let shown = false;
    const cue = mode === "say"
      ? `<div class="card prompt">${t.pic ? `<div class="bigpic pop">${t.pic}</div>` : ""}<div class="kind">${t.kind === "word" ? "Say this word" : "Say this in Japanese"}</div><div class="en">${esc(t.cue)}</div></div>`
      : `<div class="card prompt"><button class="play" id="hear" aria-label="Play">${IC.sound.replace("<svg", '<svg width="28" height="28"')}</button><div class="kind">Listen, then repeat</div><div id="txt" class="q x" style="font-size:20px" hidden>${t.rb}</div><button class="say" id="showtx">Show the words</button></div>`;
    app.innerHTML = topbar(mode === "say" ? "Say it in Japanese" : "Listen and repeat") + `<div class="stack" style="--tc:${TOPIC_COLOR(n)}">
      <div class="row"><div class="prog"><i style="width:${i / items.length * 100}%"></i></div><span class="small muted">${i + 1}/${items.length}</span></div>
      ${cue}
      <textarea class="say-in" id="ans" lang="ja" rows="2" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Tap here, then 🎤 on your keyboard and speak…"></textarea>
      <div class="row"><button class="btn" id="show" style="flex:1">Show answer</button><button class="btn primary" id="chk" style="flex:1.4">${IC.mic} Check</button></div>
      <div id="res"></div></div>`;
    if (mode === "repeat") { const hear = () => sayNow(t.jp); $("#hear").onclick = hear; setTimeout(hear, 250); $("#showtx").onclick = e => { $("#txt").hidden = false; e.currentTarget.hidden = true; }; }
    const model = `<div class="card stack" style="gap:6px"><span class="kind">Model answer</span><div class="q x" style="font-size:20px">${t.rb}</div>${t.kana && normJ(t.kana) !== normJ(t.jp) ? `<div class="small muted jp">${esc(t.kana)}</div>` : ""}${t.cue && mode === "repeat" ? `<div class="small muted">${esc(t.cue)}</div>` : ""}<div><button class="say" data-act="say" data-text="${esc(t.jp)}">${IC.sound} Listen</button></div></div>`;
    $("#chk").onclick = () => {
      const v = $("#ans").value.trim();
      if (!v) { $("#ans").focus(); $("#res").innerHTML = `<p class="note">Tap the box, switch to the Japanese keyboard and tap 🎤, or type your answer. Or tap Show answer.</p>`; return; }
      const r = scoreSpeech(v, t); const [msg, col, pass] = verdict(r.pct);
      scores[i] = Math.max(scores[i], r.pct); sfx(r.pct >= 60 ? "ok" : "no");
      $("#res").innerHTML = `<div class="card stack pop"><div class="meter"><div class="ring" style="--p:${r.pct};--rc:${col}"><span>${r.pct}%</span></div><div><b style="color:${col}">${msg}</b><div class="small muted">What the app heard:</div><div class="diff">${diffHtml(r.a, r.best)}</div></div></div></div>${model}
        <div class="row"><button class="btn" id="retry" style="flex:1">Try again</button><button class="btn primary" id="nx" style="flex:1.4">${pass ? "Next" : "Skip"}</button></div>`;
      sayNow(t.jp); applyFuri(); bindNext();
    };
    $("#show").onclick = () => {
      if (shown) return; shown = true;
      $("#res").innerHTML = `${model}<div class="card stack"><b>Did you say it right?</b><div class="tf"><button class="opt en" id="yes">○ Yes</button><button class="opt en" id="no">✕ Not yet</button></div></div>`;
      sayNow(t.jp); applyFuri();
      $("#yes").onclick = () => { scores[i] = Math.max(scores[i], 90); sfx("ok"); i++; paint(); };
      $("#no").onclick = () => { sfx("soft"); i++; paint(); };
    };
    function bindNext() {
      $("#retry").onclick = () => { $("#ans").value = ""; $("#res").innerHTML = ""; $("#ans").focus(); };
      $("#nx").onclick = () => { stopSpeech(); i++; paint(); };
    }
    applyFuri();
  }
  paint();
}

function viewRoleplay(n, di, role) {
  const d = L(n).listen[di];
  const speakers = [...new Set(d.lines.map(x => plain(x[0])).filter(Boolean))];
  if (!role) {
    app.innerHTML = topbar(esc(d.t)) + `<div class="stack" style="--tc:${TOPIC_COLOR(n)}">
      <div class="card stack"><b>Choose your part</b><span class="small muted">The app speaks the other lines. When it's your turn, say your line, then check it.</span>
      <div class="opts">${speakers.map(s => `<button class="opt" data-s="${esc(s)}">🎭 ${esc(s)}</button>`).join("")}</div></div>
      <div class="card dl">${d.lines.map(x => `<div class="ln"><span class="sp">${x[0]}</span><span class="tx x">${x[1]}</span></div>`).join("")}</div></div>`;
    app.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { stack.pop(); go(viewRoleplay, n, di, b.dataset.s); });
    applyFuri(); return;
  }
  const mine = d.lines.map((x, k) => plain(x[0]) === role ? k : -1).filter(k => k >= 0);
  const scores = {}; let k = 0, alive = true;
  const voice = sp => ({ voice: Math.max(0, speakers.indexOf(sp)), pitch: VOICES.length > 1 ? 1 : [1, 1.25, 0.85][Math.max(0, speakers.indexOf(sp)) % 3] });
  app.innerHTML = topbar(`Role-play · ${esc(role)}`) + `<div class="stack" style="--tc:${TOPIC_COLOR(n)}">
    <div class="card dl" id="dl"></div><div id="turn"></div></div>`;
  const dl = $("#dl");
  function addLine(x, k, hidden) {
    const el = document.createElement("div"); el.className = "ln pop"; el.dataset.k = k;
    el.innerHTML = `<span class="sp">${x[0]}</span><span class="tx x">${hidden ? "<span class='muted'>…your line…</span>" : x[1]}</span>`;
    dl.appendChild(el); applyFuri(); el.scrollIntoView({ block: "nearest", behavior: "smooth" }); return el;
  }
  function step() {
    if (!alive || !document.body.contains(dl)) return;
    if (k >= d.lines.length) return finish();
    const x = d.lines[k], sp = plain(x[0]);
    if (sp !== role) {
      const el = addLine(x, k); el.classList.add("on");
      speak(x[2], { ...voice(sp), onend: () => { el.classList.remove("on"); k++; setTimeout(step, 300); } });
      if (!canSpeak()) setTimeout(() => { k++; step(); }, 1500);
      return;
    }
    const el = addLine(x, k, true);
    $("#turn").innerHTML = `<div class="turn stack pop"><b>Your turn! 🎤</b>
      <textarea class="say-in" id="ans" lang="ja" rows="2" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Tap here, then 🎤 and say your line…"></textarea>
      <div class="row"><button class="btn" id="hint" style="flex:1">Hint</button><button class="btn primary" id="chk" style="flex:1.4">${IC.mic} Check</button></div><div id="hn"></div></div>`;
    $("#hint").onclick = () => { $("#hn").innerHTML = `<div class="q x" style="font-size:18px">${x[1]}</div>`; applyFuri(); };
    $("#chk").onclick = () => {
      const v = $("#ans").value.trim();
      const r = v ? scoreSpeech(v, { jp: x[2], kana: x[3] }) : { pct: 0, a: "", best: "" };
      scores[k] = r.pct; const [msg, col] = verdict(r.pct); sfx(r.pct >= 60 ? "ok" : "no");
      el.querySelector(".tx").innerHTML = x[1];
      $("#turn").innerHTML = `<div class="card stack pop"><div class="meter"><div class="ring" style="--p:${r.pct};--rc:${col}"><span>${r.pct}%</span></div><div><b style="color:${col}">${v ? msg : "Here's the line."}</b>${v ? `<div class="diff">${diffHtml(r.a, r.best)}</div>` : ""}</div></div><button class="btn primary block" id="go">Continue</button></div>`;
      applyFuri(); sayNow(x[2], voice(role));
      $("#go").onclick = () => { stopSpeech(); $("#turn").innerHTML = ""; k++; step(); };
    };
  }
  function finish() {
    const vals = mine.map(k => scores[k] || 0); const pct = Math.round(vals.reduce((a, b) => a + b, 0) / Math.max(1, vals.length));
    S.sc[`rp${n}-${di}`] = Math.max(S.sc[`rp${n}-${di}`] || 0, pct); recordSpeak(n, pct); celebrate(pct >= 70);
    $("#turn").innerHTML = `<div class="card result stack pop"><div class="hop">${mascot(pct >= 70 ? "happy" : "wow", 72)}</div><div class="score">${pct}%</div><div>Average match on your ${mine.length} ${mine.length > 1 ? "lines" : "line"}</div>
      <div class="row"><button class="btn" id="sw" style="flex:1">Switch part</button><button class="btn primary" id="ag" style="flex:1">Play again</button></div></div>`;
    $("#ag").onclick = () => { stack.pop(); go(viewRoleplay, n, di, role); };
    $("#sw").onclick = () => { stack.pop(); go(viewRoleplay, n, di, speakers.find(s => s !== role)); };
  }
  setTimeout(step, 300);
}

3: ["Meet a new coworker: names and hometowns.", "a new coworker meeting the learner for the first time, asking their name and where they are from"],
4: ["Talk about your family and where you live.", "a coworker looking at family photos with the learner, asking who people are, their ages and where they live"],
5: ["Lunch chat: foods you like, drinks, breakfast.", "a coworker eating lunch with the learner in the company cafeteria, asking about foods they like or dislike, offering a drink, asking about breakfast"],
6: ["Order at a burger shop.", "a staff member at a hamburger shop taking the learner's order (item, size, drink, eat here or take out)"],
7: ["Describe your home.", "a friend asking where the learner lives and what the home is like and what is in it"],
8: ["Find people and things at the office.", "a coworker; ask and answer where people (in the cafeteria, meeting room…) and things (scissors, glue…) are"],
9: ["Daily routine and picking a day to meet.", "a coworker chatting about what time the learner gets up and goes to bed, work hours, and choosing a day to go swimming together"],
10: ["Follow requests at work and borrow things.", "a supervisor giving the learner simple requests (copies, tidying, bringing chairs) with numbers and times to confirm, and lending things"],
11: ["Hobbies and days off.", "a friend asking about the learner's hobbies, what kind of things they like, and what they do on days off"],
12: ["Invite and be invited.", "a friend inviting the learner to events (festival, yakiniku, a movie) — the learner accepts or declines politely"],
13: ["Getting around by bus and train.", "a person at a bus stop or station; the learner asks whether a bus or train goes somewhere, and you also chat about how they get to work and how long it takes"],
14: ["Walking around town.", "a friend walking around town with the learner, talking about places (lively streets, big buildings, temples) and asking where things are"],
15: ["Shopping: find items, compliment things.", "a shop assistant; the learner wants to buy something, asks where it is or which floor, and comments on items (cute, cool, cheap, expensive)"],
16: ["Prices and the convenience store.", "a shop clerk; the learner asks prices, buys items in quantities, and answers checkout questions (heat it up? bag? how many spoons?)"],
17: ["What did you do on the weekend?", "a coworker asking about the learner's weekend: what they did, where they went, and how it was"],
18: ["Holiday plans and wishes.", "a friend asking about the learner's holiday plans, what they want to do in Japan, and a recent trip"],
};
function chatRules(n) {
  const l = L(n);
  const words = l.vocab.map(v => v.jp).join("、");
  const gram = l.grammar.map(g => g.p).join(" / ");
  return `You are a friendly Japanese conversation partner for a beginner studying the Japan Foundation coursebook "Irodori Starter (A1)", Lesson ${n}: ${l.title} (${l.titleEn}).
Role-play scenario: you are ${SCENES[n][1]}.
Rules:
- Use very simple, natural Japanese at A1 level, mostly polite です/ます form. One or two short sentences (under 45 characters total), then ONE simple question to keep the conversation going.
- Prefer words from this lesson: ${words}
- Use this lesson's grammar where natural: ${gram}
- Earlier lessons covered greetings, self-introduction, family, food, home, workplace, time, requests, hobbies, invitations, transport, town, shopping, past tense and wants — you may use those too, but nothing harder.
- The learner's messages may come from voice dictation, so forgive small recognition errors. If they write in English or get stuck, help them say it in Japanese.
Reply with ONLY a JSON object, no other text:
{"ja":"your Japanese line","kana":"the same line in hiragana/katakana only","en":"English translation","fix":"if the learner's last message had a mistake or sounded unnatural, a short friendly note in English with the corrected Japanese; otherwise an empty string","good":"if the learner's message was good, 2–5 words of English praise; otherwise empty"}`;
}
function viewChat(n) {
  const turns = []; let busy = false, ctl = null, userCount = 0;
  app.innerHTML = topbar("Chat with Claude") + `<div class="stack" style="--tc:${TOPIC_COLOR(n)}">
    <div class="card row" style="align-items:center"><div class="bob">${mascot("happy", 48)}</div><div><b>${esc(SCENES[n][0])}</b><div class="small muted">Claude plays the other person and speaks simply. Each message uses a little of your Claude usage.</div></div></div>
    ${MIC_HELP}
    <div class="chat" id="chat"></div>
    <div class="row" style="flex-wrap:wrap;gap:6px" id="chips">${["もういちど、お願いします。", "ゆっくり言ってください。", "わかりません。", "How do I say…?"].map(c => `<button class="chip" data-c="${esc(c)}" style="border:0">${esc(c)}</button>`).join("")}</div>
    <div class="bar"><textarea class="say-in" id="ans" lang="ja" rows="1" placeholder="Reply by voice (🎤) or typing…" autocomplete="off" spellcheck="false"></textarea><button class="btn primary" id="send" aria-label="Send">Send</button></div></div>`;
  const chat = $("#chat");
  const add = (html, cls) => { const el = document.createElement("div"); el.className = "msg " + cls + " pop"; el.innerHTML = html; chat.appendChild(el); el.scrollIntoView({ block: "nearest", behavior: "smooth" }); applyFuri(); return el; };
  const errText = c => c === "not_granted" ? "Chat needs your permission to use Claude. Reopen this page and choose Allow to try again."
    : c === "rate_limited" ? "Claude is getting a lot of messages from this page. Wait a minute, then send again."
    : c === "cancelled" ? "Stopped." : "Claude couldn't reply just now. Check your connection and send again.";
  async function ask() {
    const sample = window.claude && window.claude.use ? await window.claude.use("sample") : null;
    if (!sample) { add(`<b>Chat isn't available here.</b><div class="en">Open this page inside the Claude app or claude.ai to chat. The other speaking modes work everywhere.</div>`, "them"); $("#send").disabled = true; return; }
    busy = true; $("#send").disabled = true;
    const typing = add(`<span class="typing"><span></span><span></span><span></span></span>`, "them");
    ctl = new AbortController();
    try {
      const input = [{ role: "user", content: chatRules(n) + "\n\nStart the conversation now with a short greeting that fits the scenario and your first question." }, ...turns.slice(-14)];
      if (input.length > 1 && input[1].role === "user") input.splice(1, 0, { role: "assistant", content: "{}" });
      const r = await sample.json(input, { modelTier: "quick", cache: false, signal: ctl.signal });
      const ja = String(r.ja || ""), kana = String(r.kana || ""), en = String(r.en || "");
      turns.push({ role: "assistant", content: JSON.stringify({ ja, en }) });
      typing.innerHTML = `${r.fix ? `<div class="fx">✏️ ${esc(r.fix)}</div>` : r.good ? `<div class="fx">👍 ${esc(r.good)}</div>` : ""}<div class="ja">${esc(ja)}</div>${S.set.furi && kana && kana !== ja ? `<div class="kn">${esc(kana)}</div>` : ""}<div class="en" hidden>${esc(en)}</div><div class="row" style="gap:6px;margin-top:6px"><button class="say" data-act="say" data-text="${esc(ja)}">${IC.sound} Listen</button><button class="say tr">English</button></div>`;
      typing.querySelector(".tr").onclick = e => { const x = typing.querySelector(".en"); x.hidden = !x.hidden; };
      if (r.fix) typing.querySelector(".fx").style.order = "0";
      sayNow(ja);
    } catch (e) {
      typing.innerHTML = `<span class="en">${esc(errText(e && e.code))}</span>`;
      if (turns.length && turns[turns.length - 1].role === "user") turns.pop();
    }
    busy = false; $("#send").disabled = false;
  }
  function send(text) {
    text = text.trim(); if (!text || busy) return;
    add(esc(text), "me"); turns.push({ role: "user", content: text }); $("#ans").value = "";
    userCount++; logActivity(2);
    if (userCount >= 5) recordSpeak(n, Math.min(100, 70 + (userCount - 5) * 5)); else save();
    if (userCount === 5) { sfx("win"); add(`<div class="fx">🎉 Five replies! This counts toward your speaking practice. Keep chatting as long as you like.</div>`, "them"); }
    ask();
  }
  $("#send").onclick = () => send($("#ans").value);
  $("#ans").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send($("#ans").value); } });
  app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { const c = b.dataset.c; if (c.startsWith("How")) { $("#ans").value = "How do I say "; $("#ans").focus(); } else send(c); });
  ask();
}

/* ---------------- boot ---------------- */
home();
if (window.claude) initCloud(); else window.addEventListener("load", () => setTimeout(initCloud, 50));

</script>
